name: Quality

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Go quality
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install golangci-lint
        run: |
          set -eu
          mkdir -p "$PWD/.bin"
          GOBIN="$PWD/.bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$PWD/.bin/golangci-lint" version

      - name: Quality
        run: |
          set -eu
          PATH="$PWD/.bin:$PATH" make quality
