name: Quality

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Go quality
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Scan Go dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -C cmd/keebacked -scan=module

      - name: Install golangci-lint
        run: |
          set -eu
          mkdir -p "$PWD/.bin"
          GOBIN="$PWD/.bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$PWD/.bin/golangci-lint" version

      - name: Quality
        run: |
          set -eu
          PATH="$PWD/.bin:$PATH" make quality
