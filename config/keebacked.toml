# keebacked treats the source as opaque bytes. All paths are container paths.
source = "/source/vault.kdbx"
targets = ["/targets/primary", "/targets/offline"]

# Every target must contain this regular marker file before keebacked writes.
marker = ".keebacked-target"

# Wait for save bursts to settle, but always reconcile periodically in case an
# inotify event is missed or a target appears after startup.
debounce = "3s"
reconcile = "15m"

# Number of versioned history files retained per target. Zero keeps all.
keep = 100

# Source stability is confirmed before a snapshot is published.
stability_interval = "250ms"
stability_attempts = 8

# Interactive terminals receive readable colored text by default. Redirected,
# systemd, and container output remains structured JSON.
[logging]
format = "auto"
color = "auto"
